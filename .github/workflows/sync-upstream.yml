name: Sync upstream release

on:
  schedule:
    - cron: "2-59/10 * * * *"
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and replace assets for an existing fnOS release
        required: false
        type: boolean
        default: false
      package_version:
        description: Optional fnOS package version override, for example 3.5.0-beta.6.1
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - packaging/fnos/**
      - scripts/**
      - UPSTREAM_VERSION
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: fnos-upstream-sync
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: aimod-cc/Agent2API
      UPSTREAM_CHANNEL: beta
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FNOS_STORE_DISPATCH_TOKEN: ${{ secrets.FNOS_STORE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream release
        id: upstream
        shell: bash
        run: ./scripts/resolve-upstream-release.sh

      - name: Resolve package version
        id: package
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          INPUT_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          package_version="${INPUT_PACKAGE_VERSION:-${UPSTREAM_VERSION}}"
          case "${package_version}" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "Invalid package version: ${package_version}" >&2
              exit 1
              ;;
          esac
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Check existing fnOS release
        id: existing
        shell: bash
        env:
          RELEASE_TAG: fnos-v${{ steps.package.outputs.version }}
          FORCE_REBUILD: ${{ inputs.force }}
        run: |
          if [ "${FORCE_REBUILD}" != "true" ] && \
             gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Already published: ${RELEASE_TAG}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build FPK packages
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          ./scripts/build-fnos.sh --arch all \
            --upstream-version "${UPSTREAM_VERSION}" \
            --package-version "${PACKAGE_VERSION}"

      - name: Verify packages
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          ./scripts/verify-fnos.sh "dist/agent2api_${PACKAGE_VERSION}_x86.fpk"
          ./scripts/verify-fnos.sh "dist/agent2api_${PACKAGE_VERSION}_arm.fpk"

      - name: Test x86 lifecycle
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: ./scripts/test-fnos-runtime.sh "dist/agent2api_${PACKAGE_VERSION}_x86.fpk"

      - name: Create checksums
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          cd dist
          sha256sum "agent2api_${PACKAGE_VERSION}_x86.fpk" "agent2api_${PACKAGE_VERSION}_arm.fpk" > SHA256SUMS

      - name: Upload workflow artifacts
        if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agent2api-fnos-${{ steps.package.outputs.version }}
          path: |
            dist/agent2api_*.fpk
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish fnOS release
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          RELEASE_URL: ${{ steps.upstream.outputs.release_url }}
          RELEASE_TAG: fnos-v${{ steps.package.outputs.version }}
        run: |
          notes="${RUNNER_TEMP}/fnos-release-notes.md"
          {
            printf '## 核心更新\n\n'
            printf '1. 新增：Agent2API 飞牛 OS 安装包 `%s`。\n' "${PACKAGE_VERSION}"
            printf '2. 优化：补齐飞牛桌面入口所需的 64 与 256 像素图标。\n'
            printf '3. 优化：提供 x86 与 ARM 双架构，使用上游官方 Linux 服务端二进制并校验 SHA-256。\n\n'
            printf '## 其他更新\n\n'
            printf '1. 更新：上游版本 `%s`。\n' "${UPSTREAM_TAG}"
            printf '2. 更新：飞牛包版本 `%s`。\n' "${PACKAGE_VERSION}"
            printf '3. 更新：安装包由独立 fnOS 打包仓库自动构建发布。\n\n' 
            printf '上游发布：%s\n\n' "${RELEASE_URL}"
            printf '安装包与 `SHA256SUMS` 见本 Release 附件。\n'
          } > "${notes}"
          args=(
            --title "Agent2API ${PACKAGE_VERSION} for fnOS"
            --notes-file "${notes}"
          )
          if [ "${UPSTREAM_CHANNEL}" = "beta" ]; then
            args+=(--prerelease)
          fi
          assets=(
            "dist/agent2api_${PACKAGE_VERSION}_x86.fpk"
            "dist/agent2api_${PACKAGE_VERSION}_arm.fpk"
            dist/SHA256SUMS
          )
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" "${args[@]}"
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" "${args[@]}"
          fi

      - name: Notify fnos-store
        if: steps.existing.outputs.skip != 'true' && env.FNOS_STORE_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FNOS_STORE_DISPATCH_TOKEN }}
          repository: caiyy/fnos-store
          event-type: agent2api-fnos-release
          client-payload: '{"version":"${{ steps.package.outputs.version }}","release_tag":"fnos-v${{ steps.package.outputs.version }}"}'
