name: Sync upstream release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/fnos/**
      - scripts/**
      - UPSTREAM_VERSION
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: fnos-upstream-sync
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: aimod-cc/Agent2API
      UPSTREAM_CHANNEL: beta
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream release
        id: upstream
        shell: bash
        run: ./scripts/resolve-upstream-release.sh

      - name: Check existing fnOS release
        id: existing
        shell: bash
        env:
          RELEASE_TAG: fnos-${{ steps.upstream.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Already published: ${RELEASE_TAG}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build FPK packages
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: ./scripts/build-fnos.sh --arch all --version "${VERSION}"

      - name: Verify packages
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          ./scripts/verify-fnos.sh "dist/agent2api_${VERSION}_x86.fpk"
          ./scripts/verify-fnos.sh "dist/agent2api_${VERSION}_arm.fpk"

      - name: Test x86 lifecycle
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: ./scripts/test-fnos-runtime.sh "dist/agent2api_${VERSION}_x86.fpk"

      - name: Create checksums
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          cd dist
          sha256sum "agent2api_${VERSION}_x86.fpk" "agent2api_${VERSION}_arm.fpk" > SHA256SUMS

      - name: Upload workflow artifacts
        if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent2api-fnos-${{ steps.upstream.outputs.version }}
          path: |
            dist/agent2api_*.fpk
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish fnOS release
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          RELEASE_URL: ${{ steps.upstream.outputs.release_url }}
          RELEASE_TAG: fnos-${{ steps.upstream.outputs.tag }}
        run: |
          notes="${RUNNER_TEMP}/fnos-release-notes.md"
          {
            printf '## 核心更新\n\n'
            printf '1. 新增：Agent2API `%s` 的飞牛 OS 原生安装包。\n' "${VERSION}"
            printf '2. 优化：提供 x86 与 ARM 双架构，使用上游官方 Linux 服务端二进制并校验 SHA-256。\n\n'
            printf '## 其他更新\n\n'
            printf '1. 更新：上游版本 `%s`。\n' "${UPSTREAM_TAG}"
            printf '2. 更新：安装包由独立 fnOS 打包仓库自动构建发布。\n\n' 
            printf '上游发布：%s\n\n' "${RELEASE_URL}"
            printf '安装包与 `SHA256SUMS` 见本 Release 附件。\n'
          } > "${notes}"
          args=(
            --title "Agent2API ${VERSION} for fnOS"
            --notes-file "${notes}"
          )
          if [ "${UPSTREAM_CHANNEL}" = "beta" ]; then
            args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            "dist/agent2api_${VERSION}_x86.fpk" \
            "dist/agent2api_${VERSION}_arm.fpk" \
            dist/SHA256SUMS \
            "${args[@]}"
